<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Group Order</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Group Order">
<meta name="theme-color" content="#0e7c66">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{
    --bg:#f4f5f2; --card:#fff; --ink:#15181a; --mute:#6b7176; --line:#e3e5e1;
    --acc:#0e7c66; --acc-soft:#e3f2ee; --warn:#b35c00; --warn-soft:#fff2e0; --bad:#b3261e;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  input{font:inherit;color:inherit}
  .wrap{max-width:560px;margin:0 auto;padding:16px 14px 120px}
  h1{font-size:22px;margin:4px 0 2px;letter-spacing:-.01em}
  .sub{color:var(--mute);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px}
  .row{display:flex;align-items:center;gap:10px}
  .sp{flex:1}
  .pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--acc-soft);color:var(--acc)}
  .pill.lock{background:#eceef0;color:#444}
  .bar{height:8px;background:#eceeea;border-radius:99px;overflow:hidden;margin:10px 0 6px}
  .bar>i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .4s}
  .ready{background:var(--acc);color:#fff;border-color:var(--acc)}
  .ready .sub{color:#d9f1ea}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:11px;font-weight:600;background:var(--acc);color:#fff}
  .btn.sec{background:#eceeea;color:var(--ink)}
  .btn.wa{background:#25d366;color:#08331b}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn.full{width:100%}
  .btn:disabled{opacity:.45}
  .ready .btn.wa{background:#fff;color:#0b5e2e}
  .people{list-style:none;margin:8px 0 0;padding:0}
  .people li{display:flex;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
  .people li:first-child{border-top:0}
  .people .you{font-size:11px;font-weight:700;color:var(--acc);margin-left:4px}
  .muted{color:var(--mute)}
  .search{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:#fff;margin-top:12px}
  .grp{padding:10px 0;border-top:1px solid var(--line)}
  .grp:first-child{border-top:0}
  .gname{font-weight:650}
  .var{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:14px}
  .var .spec{flex:1;color:var(--mute)}
  .var .price{min-width:76px;text-align:right;font-variant-numeric:tabular-nums}
  .qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .qty button{width:32px;height:32px;font-size:18px;color:var(--acc)}
  .qty span{min-width:22px;text-align:center;font-weight:650;font-variant-numeric:tabular-nums}
  .qty.on{border-color:var(--acc);background:var(--acc-soft)}
  .dock{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid var(--line);backdrop-filter:blur(8px)}
  .dock .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .dock b{font-size:17px}
  .sheet{position:fixed;inset:0;background:rgba(10,14,12,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
  .sheet.show{display:flex}
  .sheet .panel{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  .panel h2{margin:0 0 10px;font-size:18px}
  label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:12px 0 4px}
  .inp{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#fff}
  table.bill{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
  table.bill td{padding:5px 0;vertical-align:top}
  table.bill td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  table.bill tr.tot td{border-top:1px solid var(--line);padding-top:9px;font-weight:700;font-size:16px}
  .note{font-size:12.5px;color:var(--mute);margin-top:8px}
  .note.warn{color:var(--warn);background:var(--warn-soft);padding:8px 10px;border-radius:9px}
  .err{color:var(--bad);font-size:13px;margin-top:8px}
  .stack>*+*{margin-top:8px}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#15181a;color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
  .toast.show{opacity:1}
  .foot{text-align:center;margin-top:22px;font-size:12px;color:var(--mute)}
  .foot button{text-decoration:underline;color:var(--mute)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  pre.combo{background:#f6f7f5;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12.5px;white-space:pre-wrap;margin:8px 0 0}
  .loading{padding:40px 0;text-align:center;color:var(--mute)}
  .tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:#eceeea;color:#555}
  .chips{display:flex;gap:6px;overflow-x:auto;margin:10px -14px 2px;padding:0 14px 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:#444}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .new{font-size:10px;font-weight:800;letter-spacing:.04em;color:#fff;background:#d23a2a;border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:2px}
  .code{font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#3d4a52;background:#eef1ee;border:1px solid var(--line);border-radius:5px;padding:2px 5px;margin-right:6px;white-space:nowrap}
  .acting{background:#15181a;color:#fff;border-color:#15181a}
  .acting .sub{color:#c9cdd0}
  .tag.paid{background:var(--acc-soft);color:var(--acc)}
  .half{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:99px;padding:2px 7px;margin-left:6px;white-space:nowrap}
  .split li{align-items:center}
  .quote{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Loading the order…</div></div>

<div class="dock" id="dock" style="display:none">
  <div class="in">
    <div class="sp"><div class="sub" id="dockSub"></div><b id="dockTotal"></b></div>
    <button class="btn" id="dockBtn">Review</button>
  </div>
</div>

<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>

<script>
window.__showErr = function(msg){
  var el = document.getElementById('app');
  if (el) el.innerHTML = '<div class="card"><b>Something went wrong loading the order.</b><div class="sub" style="margin-top:6px">Screenshot this for the organiser:</div><pre class="combo">' +
    String(msg).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }) + '</pre><button class="btn full" onclick="location.reload()">Try again</button></div>';
};
window.addEventListener('error', function(e){ if (!window.__loaded) window.__showErr((e.message || 'Error') + (e.lineno ? ' (line ' + e.lineno + ')' : '')); });
</script>

<script>
/*SHIP-START*/
/* ---------- shipping (Yoki's rates, Nov 2026) ----------
   This block is shared by Code.gs and Index.html so quotes on the page match the server.
   Edit SHIP if Tong changes their rates. No double-slash comments here: the page strips them. */
const SHIP = {
  methods: {
    ups:      { name: 'UPS Express',   base: 115, days: '4-8 days',  water: true },
    fedex:    { name: 'FedEx Express', base: 85,  days: '5-8 days',  water: false },
    standard: { name: 'Standard',      base: 60,  days: '7-14 days', water: true }
  },
  maxBoxes: 15,                            /* boxes per parcel */
  tiers: [[5, 0], [10, 10], [15, 20]],     /* up to N boxes: + US$ surcharge */
  freeWater: 2,                            /* water boxes per parcel with no surcharge */
  waterFee: 10,                            /* US$ per extra water box */
  waterMethod: 'standard'                  /* how waters go when sent separately */
};
function shipTier(n) {
  for (let i = 0; i < SHIP.tiers.length; i++) if (n <= SHIP.tiers[i][0]) return SHIP.tiers[i][1];
  return SHIP.tiers[SHIP.tiers.length - 1][1];
}
/* cost of sending `boxes` (of which `water` are water) by method m, filling parcels to the max */
function shipParcels(boxes, water, m) {
  if (boxes <= 0) return { cost: 0, parcels: 0, sizes: [], baseCost: 0, tierCost: 0, waterCost: 0 };
  const n = Math.ceil(boxes / SHIP.maxBoxes);
  let left = boxes, tierCost = 0;
  const sizes = [];
  for (let i = 0; i < n; i++) { const b = Math.min(SHIP.maxBoxes, left); left -= b; sizes.push(b); tierCost += shipTier(b); }
  const baseCost = n * m.base, waterCost = SHIP.waterFee * Math.max(0, water - SHIP.freeWater * n);
  return { cost: baseCost + tierCost + waterCost, parcels: n, sizes: sizes, baseCost: baseCost, tierCost: tierCost, waterCost: waterCost };
}
/* best way to ship P peptide boxes + W water boxes. waterMode: auto | together | separate */
function shipPlan(P, W, method, waterMode) {
  const m = SHIP.methods[method] || SHIP.methods.ups;
  const wm = SHIP.methods[SHIP.waterMethod];
  const pepOnly = shipParcels(P, 0, m);
  const opts = [];
  if (m.water && waterMode !== 'separate') {
    const t = shipParcels(P + W, W, m);
    opts.push({ kind: 'together', cost: t.cost, main: t, inMain: W, water: null });
  }
  if (W > 0 && (waterMode !== 'together' || !m.water)) {
    const spare = pepOnly.parcels * SHIP.maxBoxes - P;
    const maxK = m.water ? Math.min(W, spare, SHIP.freeWater * pepOnly.parcels) : 0;
    for (let k = 0; k <= maxK; k++) {
      const main = shipParcels(P + k, k, m), wp = shipParcels(W - k, W - k, wm);
      opts.push({ kind: 'separate', cost: main.cost + wp.cost, main: main, inMain: k, water: wp });
    }
  }
  if (!opts.length) opts.push({ kind: 'together', cost: pepOnly.cost, main: pepOnly, inMain: 0, water: null });
  let best = opts[0];
  opts.forEach(o => { if (o.cost < best.cost - 0.001) best = o; });
  const together = opts.filter(o => o.kind === 'together')[0] || null;
  let sep = null;
  opts.filter(o => o.kind === 'separate').forEach(o => { if (!sep || o.cost < sep.cost) sep = o; });
  return { method: method, methodName: m.name, days: m.days, waterName: wm.name, waterDays: wm.days,
    P: P, W: W, base: P > 0 ? m.base : 0, pepOnly: pepOnly.cost, total: best.cost, best: best, together: together, separate: sep };
}
/* rows: [{items, noShip}]; isWater(code) -> bool. Returns how shipping is shared out:
   - one parcel's base fee is shared equally by everyone who pays shipping
   - extra parcels and box-count surcharges are split per box (all boxes, water included)
   - water surcharges, and a separate water parcel if used, are split per water box
   If cfg.shipQuoteUSD is set (the real price from the supplier), every part is scaled to match it. */
function shipShare(rows, cfg, isWater) {
  const payers = rows.filter(r => !r.noShip);
  const nPay = payers.length;
  if (cfg.shipMethod === 'manual' || !cfg.shipMethod) {
    const t = Number(cfg.shipUSD) || 0;
    return { manual: true, total: t, calculated: t, quoted: false, shared: t, sharedEach: nPay ? t / nPay : 0, perBox: 0, perPep: 0, perWater: 0, payers: nPay, plan: null };
  }
  const combined = {};
  rows.forEach(r => Object.keys(r.items).forEach(c => combined[c] = (combined[c] || 0) + r.items[c]));
  let P = 0, W = 0;
  Object.keys(combined).forEach(c => { const q = Math.ceil(combined[c]); if (isWater(c)) W += q; else P += q; });
  const plan = shipPlan(P, W, cfg.shipMethod, cfg.waterMode || 'auto');
  const b = plan.best, m = SHIP.methods[plan.method] || SHIP.methods.ups;
  let shared = b.main.parcels ? m.base : 0;
  let boxPool = b.main.cost - shared - b.main.waterCost;
  let waterPool = b.main.waterCost + (b.water ? b.water.cost : 0);
  if (!b.main.parcels && b.water) { shared = b.water.cost; waterPool = 0; }
  const quote = Number(cfg.shipQuoteUSD) || 0;
  const scale = quote > 0 && plan.total > 0 ? quote / plan.total : 1;
  shared *= scale; boxPool *= scale; waterPool *= scale;
  let payBoxes = 0, payWater = 0;
  payers.forEach(r => Object.keys(r.items).forEach(c => { payBoxes += r.items[c]; if (isWater(c)) payWater += r.items[c]; }));
  if (!payWater) { boxPool += waterPool; waterPool = 0; }
  if (!payBoxes) { shared += boxPool; boxPool = 0; }
  const perBox = payBoxes ? boxPool / payBoxes : 0;
  return { manual: false, total: quote > 0 ? quote : plan.total, calculated: plan.total, quoted: quote > 0,
    shared: shared, sharedEach: nPay ? shared / nPay : 0, perBox: perBox, perPep: perBox,
    perWater: payWater ? waterPool / payWater : 0, payers: nPay, plan: plan };
}
/* one person's shipping in USD, with the parts */
function shipFor(items, sh, exempt, isWater) {
  if (exempt) return { total: 0, shared: 0, boxes: 0, water: 0 };
  let boxes = 0, water = 0;
  Object.keys(items).forEach(c => { boxes += (sh.perBox || 0) * items[c]; if (isWater(c)) water += sh.perWater * items[c]; });
  return { total: sh.sharedEach + boxes + water, shared: sh.sharedEach, boxes: boxes, water: water };
}
/* plain-English summary of the plan */
function shipSummary(plan) {
  if (!plan) return '';
  const b = plan.best;
  let s = plan.methodName + ': ' + b.main.parcels + ' parcel' + (b.main.parcels === 1 ? '' : 's') + ' (' + b.main.sizes.join(' + ') + ' boxes' + (b.inMain ? ', incl. ' + b.inMain + ' water' : '') + ')';
  if (b.water && b.water.parcels) s += ' + ' + plan.waterName + ' for ' + (plan.W - b.inMain) + ' water box' + (plan.W - b.inMain === 1 ? '' : 'es');
  return s + ' = US$' + plan.total.toFixed(2);
}
/*SHIP-END*/
</script>
<script>
{
/* ---------------- backend bridge ----------------
   Two routes to the server: Google's google.script.run, and a plain JSON request to the web app URL.
   google.script.run can stall when the browser is signed in to several Google accounts, so the page
   races both on first load and sticks with whichever answers. */
let route = (window.google && google.script && google.script.run) ? null : 'fetch';   /* 'gsr' | 'fetch' */
function viaGsr(fn, args){
  return new Promise((res, rej) => {
    if (!(window.google && google.script && google.script.run)) return rej(new Error('google.script.run unavailable'));
    google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(e && e.message ? e : new Error(String(e))))[fn](...args);
  });
}
async function viaFetch(fn, args){
  const r = await fetch(APP_URL, { method: 'POST', body: JSON.stringify({ fn, args }), credentials: 'omit', redirect: 'follow' });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Server error');
  return j.data;
}
function timeout(ms){ return new Promise((_, rej) => setTimeout(() => rej(new Error('timed out')), ms)); }
async function call(fn, ...args){
  if (route === 'gsr') return Promise.race([viaGsr(fn, args), timeout(30000)]);
  if (route === 'fetch') return viaFetch(fn, args);
  /* first call: try google.script.run, start the backup after 4 s, take whichever answers first */
  const errs = [];
  const a = viaGsr(fn, args).then(v => { route = route || 'gsr'; return v; }, e => { errs.push('gsr: ' + e.message); throw e; });
  const b = new Promise(r => setTimeout(r, 4000)).then(() => route ? Promise.reject(new Error('skip')) : viaFetch(fn, args))
    .then(v => { route = route || 'fetch'; return v; }, e => { if (e.message !== 'skip') errs.push('fetch: ' + e.message); throw e; });
  try { return await Promise.any([a, b, timeout(25000)]); }
  catch (e) { throw new Error(errs.join(' | ') || 'No response from the server'); }
}

  h += `<div class="row"><div class="sp"><h1>${esc(c.groupName)}</h1>
    <div class="sub">Round ${c.round} · cost price · shipping split · split kits in half</div></div>
    <span class="pill ${locked ? 'lock' : ''}">${locked ? 'Locked' : 'Open'}</span></div>`;

  /* status card */
  if (locked) {
    h += `<div class="card"><b>Order locked with ${n} ${n === 1 ? 'person' : 'people'}.</b>
      <div class="sub" style="margin-top:4px">${mine ? 'Your final amount is below.' : 'This round is closed — keep an eye out for the next one.'}</div></div>`;
  } else if (ready) {
    h += `<div class="card ready"><div style="font-size:17px;font-weight:700">🎉 Order's ready — ${n} people in</div>
      <div class="sub" style="margin-top:4px">Anyone else keen? Every extra person makes shipping cheaper for everyone.</div>
      <div class="bar" style="background:rgba(255,255,255,.25)"><i style="width:100%;background:#fff"></i></div>
      <button class="btn wa full" onclick="shareGroup()">Ask the group on WhatsApp</button></div>`;
  } else {
    const left = c.target - n;
    h += `<div class="card"><div class="row"><b class="sp">${n} of ${c.target} people in</b><span class="sub">${left} more to go</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="sub">Once ${c.target} people are in, the order is ready to place.</div>
      <button class="btn wa full" style="margin-top:10px" onclick="shareGroup()">Share on WhatsApp</button></div>`;
  }

  /* my order */
  if (mine) {
    const b = mine.bill;
    const quoted = mine.quoteAUD ? `Quoted ${aud(mine.quoteAUD)}${mine.quotedAt ? ' on ' + fmtDate(mine.quotedAt) : ''}` : '';
    h += `<div class="card"><div class="row"><b class="sp">Your order</b>${mine.paid ? '<span class="tag paid">Paid ✓</span>' : mine.paidClaim ? '<span class="tag">Payment sent</span>' : ''}</div>
      ${billTable(mine.items, b, locked ? 'Final' : 'Quote')}
      ${locked
        ? `${quoted ? `<div class="note">${quoted} · final amount uses the prices, rate and shipping when the order was placed.</div>` : ''}
           ${mine.paid ? '<div class="note">Payment received. Thanks!</div>'
             : mine.paidClaim ? '<div class="note">Thanks. The organiser will confirm once it lands.</div>'
             : `${c.payid ? `<div class="note warn">Pay <b>${aud(b.totalAUD)}</b> by PayID to <b>${esc(c.payid)}</b> · reference: your name</div>` : ''}
                <button class="btn full" style="margin-top:10px" onclick="iPaid()">I've paid ${aud(b.totalAUD)}</button>`}`
        : `<div class="note">${quoted ? quoted + '. ' : ''}This is a quote: prices, exchange rate and shipping can change before the order's placed. ${mine.noShip ? 'No shipping charged on your order.' : `Shipping is split ${payersNow()} way${payersNow() === 1 ? '' : 's'}. ${shipHint(mine.items)}`}</div>`}
      <div class="row" style="margin-top:12px;gap:8px">
        ${locked ? '' : `<button class="btn sec" onclick="editMine()">Edit</button>`}
        ${c.ownerPhone ? `<button class="btn wa sp" onclick="sendToOwner()">Send to organiser</button>` : ''}
      </div></div>`;
  }

  /* half kits looking for a partner */
  const halves = (S.openHalves || []).filter(h => P[h.code]);
  if (halves.length && !locked) {
    h += `<div class="card"><b>Split a kit?</b><div class="sub" style="margin-top:2px">These people want half a box. Take the other half and you both pay half.</div>
      <ul class="people split">${halves.map(x => {
        const mineHalf = mine && mine.items[x.code] % 1;
        return `<li><span class="sp"><span class="code">${esc(x.code)}</span>${esc(P[x.code].n)} <span class="muted">${esc(P[x.code].s.split(' × ')[0])}</span><br>
          <span class="muted" style="font-size:12px">${esc(x.names.join(', '))} · ${vials(x.code) / 2} vials · ${aud(kitAUD(x.code) / 2)}</span></span>
          ${mineHalf ? '<span class="half">Waiting for partner</span>' : `<button class="btn sec" style="padding:8px 12px" onclick="takeHalf('${x.code}')">Take half</button>`}</li>`;
      }).join('')}</ul></div>`;
  }

  /* who's in */
  if (!mine && !actingFor && n) h += `<div class="sub" style="margin:10px 2px 0">Already ordered on another phone? <button style="text-decoration:underline;color:var(--acc)" onclick="findMine()">Find my order</button></div>`;
  h += `<div class="card"><b>Who's in</b>${n ? `<ul class="people">${S.orders.map(o => `<li><span class="sp">${esc(o.name)}${o.mine ? '<span class="you">YOU</span>' : ''}</span>
      <span class="muted">${kitsTxt(o.items)}</span></li>`).join('')}</ul>`
    : `<div class="sub" style="margin-top:6px">Nobody yet — be the first.</div>`}</div>`;

  /* picker */
  if (actingFor || (!locked && (!mine || editing))) {
    const title = actingFor ? `Kits for ${esc(actingFor.name)}` : (mine ? 'Edit your kits' : 'Pick your kits');
    const chips = [['', 'All'], ['new', 'New']].concat(Object.keys(CATEGORIES).map(k => [k, CATEGORIES[k]]))
      .filter(([k]) => !k || PRODUCTS.some(p => k === 'new' ? p.nw : p.k === k))
      .map(([k, label]) => `<button class="chip ${cat === k ? 'on' : ''}" onclick="setCat('${k}')">${esc(label)}</button>`).join('');
    h += `<div class="card" id="picker"><div class="row"><b class="sp">${title}</b>
      <span class="sub">Tap + for half a box at a time · A$ at ${Number(c.rate).toFixed(3)}${c.rateSource === 'live' ? ' (live)' : ''}${Number(c.discountPct) ? ` · <b style="color:var(--acc)">${c.discountPct}% Tong discount applied at checkout</b>` : ''}</span></div>
      <input class="search" id="search" placeholder="Search name or Tong code e.g. BPC, BC10" value="${esc(q)}" autocomplete="off">
      <div class="chips">${chips}</div>
      <div id="list"></div></div>`;
  }

  h += `<div class="foot">Supplier prices at cost. Totals are quotes until the order is locked: they move as people join or leave, or if prices, the exchange rate or shipping change.<br><br>
    <button onclick="openAdmin()">Organiser</button></div>`;

  $('#app').innerHTML = h;
  const s = $('#search');
  if (s) { s.oninput = e => { q = e.target.value; renderList(); }; renderList(); }
  renderDock();
}
let editing = false;

function billTable(items, b, label){
  const c = S.cfg;
  const lines = Object.keys(items).map(code => {
    const p = P[code]; if (!p) return '';
    const spec = items[code] % 1 ? `${p.s.split(' × ')[0]} · ${items[code] * vials(code)} vials` : p.s.replace(' × ', ' · ');
    return `<tr><td><span class="code">${esc(code)}</span>${ql(items[code])} × ${esc(p.n)} <span class="muted">${esc(spec)}</span></td><td>${aud(p.u * items[code] * c.rate)}</td></tr>`;
  }).join('');
  const discRow = b.discountUSD > 0.004 ? `<tr><td style="color:var(--acc)">Tong discount ${c.discountPct}%</td><td style="color:var(--acc)">−${aud(b.discountUSD * c.rate)}</td></tr>` : '';
  return `<table class="bill">${lines}${discRow}
    <tr><td class="muted">Shipping${b.shipParts && b.shipUSD && (b.shipParts.boxes > 0.004 || b.shipParts.water > 0.004)
      ? `<br><span style="font-size:12px">${aud(b.shipParts.shared * c.rate)} shared${b.shipParts.boxes > 0.004 ? ' + ' + aud(b.shipParts.boxes * c.rate) + ' per box' : ''}${b.shipParts.water > 0.004 ? ' + ' + aud(b.shipParts.water * c.rate) + ' water' : ''}</span>` : ''}</td>
      <td class="muted">${!c.shipUSD ? 'TBC' : b.shipUSD ? aud(b.shipUSD * c.rate) : 'not charged'}</td></tr>
    ${c.feePct ? `<tr><td class="muted">Payment fee ${c.feePct}%</td><td class="muted">${aud(b.feeUSD * c.rate)}</td></tr>` : ''}
    <tr class="tot"><td>${label || 'Quote'}</td><td>${aud(b.totalAUD)}</td></tr></table>`;
}
function shipHint(items){
  const c = S.cfg, s = S.ship; if (!c.shipUSD) return 'Shipping cost to be confirmed.';
  const shared = s ? s.shared : c.shipUSD, n = Math.max(payersNow(), 1);
  return `The shared part of shipping drops from ${aud(shared / n * c.rate)} to ${aud(shared / (n + 1) * c.rate)} each if one more person joins.`;
}

function renderList(){
  const el = $('#list'); if (!el) return;
  const t = q.trim().toLowerCase();
  const gs = GROUPS.map(g => ({ n: g.n, v: g.v.filter(v => !cat || (cat === 'new' ? v.nw : v.k === cat)) }))
    .filter(g => g.v.length && (!t || g.n.toLowerCase().includes(t) || g.v.some(v => v.c.toLowerCase().includes(t))));
  const showsWater = gs.some(g => g.v.some(v => v.k === 'water'));
  el.innerHTML = (showsWater ? `<div class="note warn" style="margin:8px 0">💧 Water is heavy to ship: the first ${SHIP.freeWater} water boxes per parcel ship free, then each extra box adds about US$${SHIP.waterFee}+ in shipping, charged to whoever orders water.</div>` : '') +
    (gs.length ? gs.map(g => `<div class="grp"><div class="gname">${esc(g.n)}</div>${g.v.map(v => {
      const qn = cart[v.c] || 0, oh = openHalf(v.c), mineHalf = myOrder() && myOrder().items[v.c] % 1;
      return `<div class="var"><span class="spec"><span class="code">${esc(v.c)}</span>${esc(v.s)}${v.nw ? '<span class="new">NEW</span>' : ''}${oh && !mineHalf ? '<span class="half">½ up for grabs</span>' : ''}</span><span class="price">${aud(kitAUD(v.c))}</span>
        <div class="qty ${qn ? 'on' : ''}"><button onclick="bump('${v.c}',-0.5)" aria-label="less">−</button><span>${ql(qn)}</span><button onclick="bump('${v.c}',0.5)" aria-label="more">+</button></div></div>`;
    }).join('')}</div>`).join('') : `<div class="sub" style="padding:14px 0">No match.</div>`);
}
function setCat(k){ cat = k; document.querySelectorAll('.chip').forEach(b => b.classList.toggle('on', b.getAttribute('onclick') === `setCat('${k}')`)); renderList(); }
function bump(code, d){
  const v = Math.max(0, Math.min(50, (cart[code] || 0) + d));
  if (v) cart[code] = v; else delete cart[code];
  renderList(); renderDock();
}
function renderDock(){
  const dock = $('#dock'), k = kits(cart);
  const show = S && k > 0 && (actingFor || (S.cfg.status !== 'locked' && (!myOrder() || editing)));
  dock.style.display = show ? 'block' : 'none';
  if (!show) return;
  const ctx = editCtx(), people = ctx.payers;
  const b = bill(cart, ctx.sh, ctx.exempt);
  $('#dockSub').textContent = `Quote · ${kitsTxt(cart)} · ${ctx.exempt ? 'no shipping' : 'incl. shipping ' + aud(b.shipUSD * S.cfg.rate)}`;
  $('#dockTotal').textContent = aud(b.totalAUD);
  $('#dockBtn').onclick = review;
}

/* ---------------- review & submit ---------------- */
function review(){
  if (actingFor) return reviewFor();
  const ctx = editCtx(), people = ctx.payers;
  const b = bill(cart, ctx.sh, ctx.exempt);
  openSheet(`<h2>${myOrder() ? 'Update your order' : 'Join the order'}</h2>
    ${billTable(cart, b)}
    <div class="note">This is a quote at today's prices and exchange rate. ${ctx.exempt ? 'No shipping is charged on this order.' : `Shipping is split ${people} way${people === 1 ? '' : 's'} (including you), so it drops if more people join.`} You'll get the final amount when the order is locked.</div>
    ${Object.keys(cart).some(k => cart[k] % 1) ? `<div class="note warn">Half kits only get ordered if someone takes the other half. If nobody does, the organiser will check whether you want the full box or want to drop it.</div>` : ''}
    <label>Your name *</label><input class="inp" id="fName" value="${esc(me.name)}" placeholder="So everyone knows who's in">
    <div class="grid2"><div><label>Mobile *</label><input class="inp" id="fPhone" inputmode="tel" value="${esc(me.phone)}" placeholder="04xx xxx xxx"></div>
    <div><label>Email (optional)</label><input class="inp" id="fEmail" type="email" value="${esc(me.email)}" placeholder="For a copy"></div></div>
    <div class="err" id="fErr"></div>
    <div class="stack" style="margin-top:14px">
      <button class="btn full" id="fGo">${myOrder() ? 'Save changes' : 'Add me to the order'}</button>
      ${myOrder() ? `<button class="btn ghost full" onclick="leave()" style="color:var(--bad)">Remove my order</button>` : ''}
      <button class="btn sec full" onclick="closeSheet()">Keep shopping</button>
    </div>`);
  $('#fGo').onclick = submit;
}
async function submit(){
  me = { name: $('#fName').value.trim(), phone: $('#fPhone').value.trim(), email: $('#fEmail').value.trim() };
  if (!me.name) { $('#fErr').textContent = 'Add your name.'; return; }
  if (me.phone.replace(/\D/g, '').length < 8) { $('#fErr').textContent = 'Add your mobile. It lets you find your order on another phone.'; return; }
  store.set('me', me);
  const btn = $('#fGo'); btn.disabled = true; btn.textContent = 'Saving…';
  const wasIn = !!myOrder(), before = S.people;
  try {
    S = await call('submitOrder', { token, name: me.name, phone: me.phone, email: me.email, items: cart });
    editing = false; cart = {}; q = '';
    render();
    const n = S.people, t = S.cfg.target;
    openSheet(`<h2>${wasIn ? 'Order updated ✓' : "You're in ✓"}</h2>
      <div class="sub">${n} of ${t} people in${n >= t ? ' — the order is ready!' : ''}</div>
      ${billTable(myOrder().items, myOrder().bill)}
      <div class="stack" style="margin-top:14px">
        <button class="btn wa full" onclick="shareGroup()">${n >= t ? 'Tell the group — anyone else keen?' : 'Tell the group on WhatsApp'}</button>
        ${S.cfg.ownerPhone ? `<button class="btn sec full" onclick="sendToOwner()">Send my order to the organiser</button>` : ''}
        <button class="btn ghost full" onclick="closeSheet()">Done</button>
      </div>`);
  } catch(e) {
    btn.disabled = false; btn.textContent = 'Try again';
    $('#fErr').textContent = e.message || 'Something went wrong.';
  }
}
function takeHalf(code){
  if (myOrder() && !editing) { editing = true; cart = Object.assign({}, myOrder().items); }
  cart[code] = (cart[code] || 0) + 0.5;
  render(); renderDock(); toast(`Added ½ ${P[code].n} — tap Review to save`);
}
function editMine(){ editing = true; cart = Object.assign({}, myOrder().items); render(); const p = $('#picker'); if (p) p.scrollIntoView({ behavior: 'smooth' }); }
async function leave(){
  if (!confirm('Remove your order from this round?')) return;
  try { S = await call('removeOrder', token); editing = false; cart = {}; closeSheet(); render(); toast('Order removed'); }
  catch(e){ $('#fErr').textContent = e.message; }
}

function findMine(){

  catch(e){ toast(e.message); }
}
function announceText(){

    `• Prices at cost from Tong (codes shown), shipping split between everyone\n• You can take half a box (5 vials) and share it\n` +

}
function lockedText(){

function announce(){ wa(announceText()); }
function tellLocked(){ wa(lockedText()); }

/* ---------------- organiser: order on someone's behalf ---------------- */
function startActing(id){
  const o = id ? A.orders.find(x => x.id === id) : null;
  if (o) { actingFor = { id: o.id, name: o.name, phone: o.phone || '', email: o.email || '' }; cart = Object.assign({}, o.items); go(); return; }
  openSheet(`<h2>Add someone's order</h2>
    <label>Their name *</label><input class="inp" id="pName">
    <div class="grid2"><div><label>Mobile (optional)</label><input class="inp" id="pPhone" inputmode="tel"></div>
    <div><label>Email (optional)</label><input class="inp" id="pEmail" type="email"></div></div>
    <div class="err" id="aErr"></div>
    <div class="stack" style="margin-top:14px"><button class="btn full" id="pGo">Pick their kits</button>

function reviewFor(){
  const ctx = editCtx(), b = bill(cart, ctx.sh, ctx.exempt);
  openSheet(`<h2>Order for ${esc(actingFor.name)}</h2>${billTable(cart, b)}
    <div class="note">Saved as their quote. They'll see it once you share the link (it isn't tied to their phone, so you manage edits for these).</div>
    <label>Name</label><input class="inp" id="fName" value="${esc(actingFor.name)}">
    <div class="grid2"><div><label>Mobile</label><input class="inp" id="fPhone" inputmode="tel" value="${esc(actingFor.phone)}"></div>
    <div><label>Email</label><input class="inp" id="fEmail" type="email" value="${esc(actingFor.email)}"></div></div>
    <div class="err" id="fErr"></div>
    <div class="stack" style="margin-top:14px"><button class="btn full" id="fGo">Save ${esc(actingFor.name)}'s order</button>
    ${actingFor.id ? `<button class="btn ghost full" style="color:var(--bad)" id="fDel">Remove ${esc(actingFor.name)}</button>` : ''}
    <button class="btn sec full" onclick="closeSheet()">Keep picking</button></div>`);
  $('#fGo').onclick = async () => {

    $('#fGo').disabled = true;

  };
  if ($('#fDel')) $('#fDel').onclick = async () => {
    if (!confirm(`Remove ${actingFor.name}'s order?`)) return;

/* ---------------- WhatsApp ---------------- */
function intlPhone(phone){
  let d = String(phone || '').replace(/\D/g, '');
  if (/^0[45]\d{8}$/.test(d)) d = '61' + d.slice(1);      /* Australian mobile 04xx xxx xxx -> 614xx xxx xxx */
  return d;
}
function wa(text, phone){ openUrl('https:' + '/' + '/wa.me/' + intlPhone(phone) + '?text=' + encodeURIComponent(text)); }
function shareGroup(){
  const c = S.cfg, n = S.people;
  const names = S.orders.map(o => o.name).join(', ');
  const msg = n >= c.target
    ? `🧪 ${c.groupName}: order's ready — ${n} in (${names}). Anyone else keen? More people = cheaper shipping.\n${SHARE_URL}`
    : `🧪 ${c.groupName}: ${n}/${c.target} in${names ? ' (' + names + ')' : ''}. Need ${c.target - n} more — add your order here:\n${SHARE_URL}`;
  const hv = (S.openHalves || []).filter(x => P[x.code]).map(x => `${P[x.code].n} ${P[x.code].s.split(' × ')[0]} [${x.code}]`);
  wa(msg + (hv.length && c.status !== 'locked' ? `\n\nAnyone want to split a kit? Half going: ${hv.join(', ')}` : ''));
}
function orderText(o){
  const c = S.cfg;
  return `Order — ${c.groupName} (round ${c.round})\nName: ${o.name}\n` +
    Object.keys(o.items).map(k => `• [${k}] ${ql(o.items[k])} × ${P[k].n} ${P[k].s}${o.items[k] % 1 ? ' (' + o.items[k] * vials(k) + ' vials)' : ''}`).join('\n') +
    `\n${c.status === 'locked' ? 'Final' : 'Quote'}: ${aud(o.bill.totalAUD)} ${o.noShip ? '(no shipping)' : `(shipping split ${payersNow()} ways)`}`;
}
function sendToOwner(){ wa(orderText(myOrder()), S.cfg.ownerPhone); }

/* ---------------- sheet ---------------- */
function openSheet(html){ $('#panel').innerHTML = html; $('#sheet').classList.add('show'); }
function closeSheet(){ $('#sheet').classList.remove('show'); }
$('#sheet').onclick = e => { if (e.target.id === 'sheet') closeSheet(); };

/* ---------------- organiser ---------------- */
function openAdmin(){
  if (adminPin) return adminLoad();
  openSheet(`<h2>Organiser</h2><label>PIN</label><input class="inp" id="aPin" type="password" inputmode="numeric" placeholder="Default is 1234">
    <div class="err" id="aErr"></div><div class="stack" style="margin-top:12px"><button class="btn full" id="aGo">Open</button>
    <button class="btn sec full" onclick="closeSheet()">Cancel</button></div>`);

async function adminDo(action, data){

  catch(e){ if (/PIN/.test(e.message)) adminPin = null; const el = $('#aErr'); if (el) el.textContent = e.message; else toast(e.message); return false; }

function adminLoad(){ return adminDo('get'); }
function renderAdmin(){
  if (!A.exportLinks && lastExport) A.exportLinks = lastExport;
  const c = A.cfg, n = A.people;
  const combo = Object.keys(A.combined).sort().map(k => `${Math.ceil(A.combined[k])} × ${k}  ${P[k] ? P[k].n + ' ' + P[k].s : ''}  @ US$${P[k] ? P[k].u : '?'}${A.combined[k] % 1 ? '  (½ unclaimed)' : ''}`).join('\n');
  const oh = (A.openHalves || []).filter(x => P[x.code]);
  const ohHtml = oh.length ? `<div class="note warn" style="margin-top:12px"><b>${oh.length} half kit${oh.length === 1 ? '' : 's'} without a partner.</b> The supplier only sells full boxes, so give someone the full box or drop their half before you lock.</div>
    <ul class="people split">${oh.map(x => x.holders.map(hd => `<li><span class="sp"><b>${esc(hd.name)}</b> · <span class="code">${esc(x.code)}</span>½ ${esc(P[x.code].n)} <span class="muted">${esc(P[x.code].s.split(' × ')[0])}</span></span>
      <button class="tag" onclick="adminDo('setQty',{id:'${hd.id}',code:'${x.code}',qty:${hd.qty + 0.5}})">Full box</button>
      <button class="tag" onclick="adminDo('setQty',{id:'${hd.id}',code:'${x.code}',qty:${hd.qty - 0.5}})">Drop ½</button></li>`).join('')).join('')}</ul>` : '';
  const discUSD = A.discountUSD || 0, totalUSD = A.productsUSD - discUSD + c.shipUSD;
  const totLine = `Products US$${A.productsUSD.toFixed(2)}${discUSD ? ` − ${c.discountPct}% discount US$${discUSD.toFixed(2)}` : ''} + shipping US$${c.shipUSD.toFixed(2)} = US$${totalUSD.toFixed(2)}`;
  lastCombo = combo + '\n\n' + totLine;
  const collected = A.orders.reduce((s,o) => s + o.bill.totalAUD, 0);
  openSheet(`<h2>Organiser · round ${c.round}</h2>
    <div class="sub">${n} ${n === 1 ? 'person' : 'people'} · ${c.status}</div>

    <label>Combined order for the supplier</label>
    ${A.ship && A.ship.plan ? (() => { const p = A.ship.plan, alt = p.best.kind === 'separate' ? p.together : p.separate;
      return `<div class="note" style="margin-top:8px"><b>Shipping:</b> ${esc(shipSummary(p))}${p.best.water && p.best.water.parcels ? ` <span class="muted">(waters ${esc(p.waterDays)})</span>` : ''}` +
        (alt && Math.abs(alt.cost - p.total) > 0.01 ? `<br><span class="muted">${alt.kind === 'together' ? 'All in ' + esc(p.methodName) : 'Waters by ' + esc(p.waterName)} would be US$${alt.cost.toFixed(2)} (${alt.cost > p.total ? 'US$' + (alt.cost - p.total).toFixed(2) + ' more' : 'US$' + (p.total - alt.cost).toFixed(2) + ' less'})</span>` : '') +
        (A.ship.quoted ? `<br><b>Using Yoki's quote: US$${A.ship.total.toFixed(2)}</b> <span class="muted">(calculated US$${A.ship.calculated.toFixed(2)})</span>` : '') +
        `<br><span class="muted">Shared ÷${A.ship.payers}: US$${A.ship.shared.toFixed(2)} · per box US$${(A.ship.perBox || 0).toFixed(2)}${A.ship.perWater ? ' · extra per water box US$' + A.ship.perWater.toFixed(2) : ''}</span></div>`; })() : ''}
    <pre class="combo">${esc(combo || 'Nothing yet')}\n\n${esc(totLine)}</pre>
    <button class="btn wa full" style="margin-top:6px" onclick="${c.status === 'locked' ? 'tellLocked()' : 'announce()'}">${c.status === 'locked' ? '🔒 Tell the group it\'s locked (they check their amount)' : '📣 Announce this round to the group'}</button>
    <button class="btn wa full" style="margin-top:6px" onclick="sendGroup()" ${Object.keys(A.combined).length ? '' : 'disabled'}>Send full order to Yoki (group, WhatsApp)</button>
    <div class="row" style="gap:8px;margin-top:6px"><button class="btn sec sp" onclick="copyCombo()">Copy as text</button>
      <button class="btn sp" onclick="makeExcel()" ${Object.keys(A.combined).length ? '' : 'disabled'}>Make Excel files</button></div>
    ${A.exportLinks ? `<div class="note" style="margin-top:8px"><b>Excel ready</b> · ${A.exportLinks.lines} Tong lines · ${A.exportLinks.people} people · US$${A.exportLinks.totalUSD.toFixed(2)}. Opens in your Google account, then downloads as .xlsx.</div>
      <div class="stack" style="margin-top:6px">
        <button class="btn full" onclick="openLink('book')">⬇ Full workbook (.xlsx): Tong order + payments + a tab per person</button>
        <button class="btn sec full" onclick="openLink('tong')">⬇ Tong order only (.xlsx): to send Yoki</button>
        <button class="btn ghost full" onclick="openLink('sheet')">Open in Google Sheets</button></div>` : ''}
    ${ohHtml}

    <label>People · collecting ${aud(collected)} · shipping split ${A.payers} way${A.payers === 1 ? '' : 's'} · tap WA to send each person their breakdown</label>
    <button class="btn full" style="margin:4px 0 6px" onclick="startActing()">+ Add someone's order</button>
    <ul class="people">${A.orders.map(o => `<li style="align-items:center"><span class="sp"><b>${esc(o.name)}</b> <button class="tag" onclick="startActing('${o.id}')">Edit</button><br>
      <span class="muted" style="font-size:12px">${esc(Object.keys(o.items).map(k => k + ' ' + ql(o.items[k]) + '× ' + (P[k] ? P[k].n + ' ' + P[k].s.split(' × ')[0] : '')).join(', '))}</span><br>
      <span class="muted" style="font-size:12px">${esc(o.phone || '')} ${esc(o.email || '')}</span></span>
      <span style="text-align:right">${aud(o.bill.totalAUD)}${o.quoteAUD && Math.abs(o.quoteAUD - o.bill.totalAUD) > 0.004 ? `<br><span class="muted" style="font-size:11px">quoted ${aud(o.quoteAUD)}</span>` : ''}</span>
      <button class="tag ${o.paid ? 'paid' : ''}" style="${!o.paid && o.paidClaim ? 'background:#fff2e0;color:#b35c00' : ''}" onclick="adminDo('setPaid',{id:'${o.id}',paid:${!o.paid}})" title="${!o.paid && o.paidClaim ? 'They tapped I\'ve paid. Tap to confirm' : ''}">${o.paid ? 'Paid' : o.paidClaim ? 'Says paid' : 'Unpaid'}</button>
      <button class="tag" style="${o.noShip ? 'background:#fff2e0;color:#b35c00' : ''}" onclick="adminDo('setNoShip',{id:'${o.id}',noShip:${!o.noShip}})" title="Tap to switch">${o.noShip ? 'No ship' : 'Ship ✓'}</button>
      <button class="tag" style="background:#25d366;color:#08331b" onclick="payMsg('${o.id}')" title="${o.phone ? 'Send to ' + esc(o.phone) : 'WhatsApp will ask who to send to'}">WA</button></li>`).join('') || '<li class="muted">Nobody yet</li>'}</ul>

    <label>Settings</label>
    <div class="grid2">
      <div><label>Group name</label><input class="inp" id="sName" value="${esc(c.groupName)}"></div>
      <div><label>People target</label><input class="inp" id="sTarget" inputmode="numeric" value="${c.target}"></div>
      <div><label>Shipping method</label><select class="inp" id="sShipM">${['ups', 'fedex', 'standard'].map(k => `<option value="${k}" ${c.shipMethod === k ? 'selected' : ''}>${esc(SHIP.methods[k].name)} (US$${SHIP.methods[k].base})</option>`).join('')}<option value="manual" ${c.shipMethod === 'manual' ? 'selected' : ''}>Manual amount</option></select></div>
      <div><label>Waters</label><select class="inp" id="sWater"><option value="auto" ${c.waterMode === 'auto' ? 'selected' : ''}>Cheapest way</option><option value="together" ${c.waterMode === 'together' ? 'selected' : ''}>Same parcel</option><option value="separate" ${c.waterMode === 'separate' ? 'selected' : ''}>Separately by Standard</option></select></div>
      <div><label>Tong discount %</label><input class="inp" id="sDisc" inputmode="decimal" value="${c.discountPct || 0}"></div>
      <div><label>Shipping quoted by Yoki US$</label><input class="inp" id="sQuote" inputmode="decimal" value="${c.shipQuoteUSD || ''}" placeholder="blank = calculated"></div>
      <div><label>Manual shipping US$</label><input class="inp" id="sShip" inputmode="decimal" value="${c.manualShipUSD != null ? c.manualShipUSD : c.shipUSD}" placeholder="only for Manual"></div>
      <div><label>Exchange rate</label><select class="inp" id="sMode"><option value="live" ${c.rateMode === 'live' ? 'selected' : ''}>Live + buffer</option><option value="manual" ${c.rateMode !== 'live' ? 'selected' : ''}>Manual</option></select></div>
      <div><label>Buffer (added to live)</label><input class="inp" id="sBuf" inputmode="decimal" value="${c.rateBuffer}"></div>
      <div><label>Manual AUD per USD</label><input class="inp" id="sRate" inputmode="decimal" value="${c.manualRate}"></div>
      <div><label>Rate in use</label><div class="inp" style="background:#f6f7f5">${Number(c.rate).toFixed(4)}<span class="muted" style="font-size:12px"> · ${esc(c.rateSource)}${c.liveRate ? ' · live ' + Number(c.liveRate).toFixed(4) : ''}</span></div></div>
      <div><label>Payment fee %</label><input class="inp" id="sFee" inputmode="decimal" value="${c.feePct}"></div>
      <div><label>Your PayID</label><input class="inp" id="sPayid" value="${esc(c.payid)}"></div>
      <div><label>Your WhatsApp (61…)</label><input class="inp" id="sPhone" inputmode="tel" value="${esc(c.ownerPhone)}"></div>
      <div><label>Order emails to</label><input class="inp" id="sEmail" type="email" value="${esc(c.notifyEmail)}" placeholder="Your Google email"></div>
      <div><label>New PIN (4+)</label><input class="inp" id="sPin" inputmode="numeric" placeholder="Leave blank to keep"></div>
    </div>
    <div class="err" id="aErr"></div>
    <div class="stack" style="margin-top:12px">
      <button class="btn full" onclick="saveSettings()">Save settings</button>
      ${c.status === 'open'
        ? `<button class="btn sec full" onclick="if(confirm(lockMsg()))adminDo('lock')">Lock order (I'm placing it)</button>`
        : `<button class="btn sec full" onclick="adminDo('unlock')">Unlock</button>
           <button class="btn ghost full" onclick="if(confirm('Start a fresh round? This round stays in the sheet.'))adminDo('newRound')">Start new round</button>`}
      <button class="btn ghost full" onclick="closeSheet()">Close</button>
    </div>`);
}
let lastExport = null;
async function makeExcel(){
  toast('Building the Excel files…');
  if (await adminDo('exportSheets')) { lastExport = A.exportLinks; renderAdmin(); toast('Excel files ready'); }
}
function openLink(k){ const l = (A && A.exportLinks) || lastExport; if (l && l[k]) openUrl(l[k]); }
function lockMsg(){
  const n = (A.openHalves || []).length;
  return (n ? `Heads up: ${n} half kit${n === 1 ? ' has' : 's have'} no partner and will be ordered as full boxes.\n\n` : '') +
    'Lock the order? People can no longer join or edit, and anyone with an email gets their final amount.';
}
async function saveSettings(){
  const d = { groupName: $('#sName').value, target: $('#sTarget').value, shipUSD: $('#sShip').value, shipMethod: $('#sShipM').value, waterMode: $('#sWater').value, discountPct: $('#sDisc').value || 0, shipQuoteUSD: $('#sQuote').value || 0, rate: $('#sRate').value, rateMode: $('#sMode').value, rateBuffer: $('#sBuf').value,
    feePct: $('#sFee').value, payid: $('#sPayid').value, ownerPhone: $('#sPhone').value, notifyEmail: $('#sEmail').value };
  const pin = $('#sPin').value.trim(); if (pin) d.adminPin = pin;
  if (await adminDo('saveCfg', d)) { if (pin) adminPin = pin; toast('Saved'); }
}
function personText(o, c, n){
  const locked = c.status === 'locked';
  const lines = PRODUCTS.map(p => p.c).filter(k => o.items[k]).map(k => {
    const q = o.items[k], half = q % 1 ? ` (${q * vials(k)} vials)` : '';
    return `• [${k}] ${ql(q)} × ${P[k].n} ${P[k].s.split(' × ')[0]}${half}: ${aud(P[k].u * q * c.rate)}`;
  }).join('\n');
  return `Hi ${o.name}, here's your part of ${c.groupName} (round ${c.round}, ${n} people):\n\n${lines}\n` +
    (o.bill.discountUSD > 0.004 ? `• Tong discount ${c.discountPct}%: −${aud(o.bill.discountUSD * c.rate)}\n` : '') +
    (o.noShip ? `• Shipping: not charged\n` : (() => { const sp = o.bill.shipParts || { shared: o.bill.shipUSD, boxes: 0, water: 0 };
      return `• Shipping: ${aud(o.bill.shipUSD * c.rate)} (${aud(sp.shared * c.rate)} shared ÷${A.payers}` +
        (sp.boxes > 0.004 ? ` + ${aud(sp.boxes * c.rate)} for your boxes` : '') + (sp.water > 0.004 ? ` + ${aud(sp.water * c.rate)} for water` : '') + `)\n`; })()) +
    (c.feePct ? `• Payment fee ${c.feePct}%: ${aud(o.bill.feeUSD * c.rate)}\n` : '') +
    `\n*${locked ? 'Final total' : 'Your total (quote)'}: ${aud(o.bill.totalAUD)}*` +
    (o.quoteAUD && Math.abs(o.quoteAUD - o.bill.totalAUD) > 0.004 ? ` (first quoted ${aud(o.quoteAUD)})` : '') +
    `\nRate ${Number(c.rate).toFixed(4)} AUD/USD` +
    (locked && c.payid ? `\n\nPlease pay by PayID: ${c.payid}\nReference: ${o.name}` : (locked ? '' : `\n\nThis may still change slightly before the order's locked. I'll send the final amount then.`));
}
function payMsg(id){
  const o = A.orders.find(x => x.id === id);
  wa(personText(o, A.cfg, A.people), o.phone);
}
function groupText(){
  const c = A.cfg, n = A.people;
  const codes = PRODUCTS.map(p => p.c).filter(k => A.combined[k]);
  const lines = codes.map(k => {
    const q = Math.ceil(A.combined[k]);
    return `• [${k}] ${P[k].n} ${P[k].s}: ${q} kit${q === 1 ? '' : 's'} × US$${P[k].u} = US$${(q * P[k].u).toFixed(2)}`;
  }).join('\n');
  const kits = codes.reduce((s, k) => s + Math.ceil(A.combined[k]), 0);
  const disc = A.discountUSD || 0, total = A.productsUSD - disc + c.shipUSD;
  return `Hi Yoki, here's our order (${c.groupName}, round ${c.round}):\n\n${lines}\n\n` +
    `${kits} kit${kits === 1 ? '' : 's'} · products US$${A.productsUSD.toFixed(2)}` + (disc ? ` − ${c.discountPct}% discount US$${disc.toFixed(2)}` : '') +
    (c.shipUSD ? ` + shipping US$${c.shipUSD.toFixed(2)} = *US$${total.toFixed(2)}*` : ` (+ shipping)`) + `\n` +
    (A.ship && A.ship.plan && !A.ship.quoted ? `Shipping: ${shipSummary(A.ship.plan)}\n` : '') + `\n` +
    `Everyone who's ordered (${n}): I've sent you your own breakdown and total, so check your messages 👍`;
}
function sendGroup(){ wa(groupText()); }

/* ---------------- boot ---------------- */
async function load(){
  try { S = await call('getState', token); render(); window.__loaded = true; }
  catch(e){ window.__showErr(e.message); }
}
load();
setInterval(() => { if (S && !$('#sheet').classList.contains('show') && !editing && !actingFor && !kits(cart)) call('getState', token).then(s => { S = s; render(); }).catch(()=>{}); }, 30000);
Object.assign(window, { bump, setCat, takeHalf, editMine, leave, shareGroup, sendToOwner, closeSheet, openAdmin, adminDo, saveSettings,
  payMsg, copy, copyCombo: () => copy(lastCombo), sendGroup, announce, tellLocked, findMine, iPaid, makeExcel, openLink, startActing, cancelActing, renderAdmin, lockMsg, review });
}
</script>
</body>
</html>
